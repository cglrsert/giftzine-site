<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GiftZine'i indir</title>
<meta name="description" content="GiftZine: fotoğraflarından kişiye özel dergi hediyesi. App Store ve Google Play'de.">
<meta name="theme-color" content="#6B1F2A">
<meta name="robots" content="noindex">
<meta property="og:title" content="GiftZine — fotoğraflarından kişiye özel dergi">
<meta property="og:image" content="media/poster-tr.jpg">
<link rel="icon" href="media/icon-64.png">
<link rel="stylesheet" href="site.css">
<style>
  /* One link for ads and the Instagram profile: iPhone and iPad go to the App Store, Android to Google Play,
     anything else sees both buttons. */
  body { min-height: 100vh; display: grid; place-items: center; text-align: center; color: var(--ivory);
    background: radial-gradient(900px 500px at 20% 0%, #8E2C3C 0%, transparent 60%), linear-gradient(160deg, var(--burg) 0%, var(--burg-d) 100%); }
  main { padding: 40px 16px; max-width: 520px; }
  main img { margin: 0 auto 22px; border-radius: 22%; box-shadow: 0 16px 40px rgba(0, 0, 0, .35); }
  h1 { font-size: clamp(36px, 9vw, 52px); }
  p { color: #EBDAD3; margin: 14px 0 28px; }
  .stores { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .stores .btn { min-width: 240px; }
</style>
<script>
  (function () {
    var ua = navigator.userAgent || "";
    var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var play = "https://play.google.com/store/apps/details?id=com.giftzine.app&referrer=utm_source%3Dinstagram%26utm_medium%3Dpaid%26utm_campaign%3Dreels_tr_az";
    if (ios) {
      location.replace("https://apps.apple.com/app/id6828014390");
    } else if (/Android/.test(ua)) {
      // In-app browsers (Instagram, Facebook) hand market:// links to the Play Store app; the web page is the fallback.
      location.href = "market://details?id=com.giftzine.app&referrer=utm_source%3Dinstagram%26utm_medium%3Dpaid%26utm_campaign%3Dreels_tr_az";
      setTimeout(function () { location.replace(play); }, 1500);
    }
  })();
</script>
</head>
<body>
<main>
  <img src="media/icon-180.png" alt="" width="96" height="96">
  <h1>Gift<i>Zine</i></h1>
  <p>Fotoğraflarından kişiye özel dergi hediyesi. Bir kez al, sınırsız dergi yap.</p>
  <div class="stores">
    <a class="btn" href="https://apps.apple.com/app/id6828014390">App Store'dan indir</a>
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.giftzine.app&amp;referrer=utm_source%3Dinstagram%26utm_medium%3Dpaid%26utm_campaign%3Dreels_tr_az">Google Play'den indir</a>
  </div>
</main>
</body>
</html>
